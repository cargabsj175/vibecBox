name: vibecBox Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test runner
        run: |
          python -m venv .venv --system-site-packages
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run test_core.py
        run: python3 test_core.py
        env:
          CI: true

      - name: Run test_qemu.py
        run: python3 test_qemu.py
        env:
          CI: true

      - name: Run test_gui.py (offscreen)
        run: |
          QT_QPA_PLATFORM=offscreen .venv/bin/python test_gui.py
        env:
          CI: true

      - name: Run test_runner.py (offscreen)
        run: |
          QT_QPA_PLATFORM=offscreen .venv/bin/python test_runner.py
        env:
          CI: true
